name: Build Spring Boot Application

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EmployeeManagementSystem

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Build and capture full output to build.log
      - name: Build Application
        id: build
        run: |
          mvn clean package -DskipTests 2>&1 | tee ../build.log
          echo "build_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload JAR Artifact
        if: steps.build.outputs.build_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: EmployeeManagementSystem/target/*.jar

      # Upload log as artifact (always — useful for debugging)
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          retention-days: 7

      # Call the AI agent on failure
      # Call the AI agent on failure
      - name: Trigger AI Diagnosis
        if: steps.build.outputs.exit_code != '0'
        env:
          AGENT_URL:    ${{ secrets.AGENT_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          cd ..

          # Extract last 200 lines only — avoids "argument list too long"
          tail -200 build.log > build_tail.log

          # Write JSON payload to a file — never pass big text as shell variable
          python3 - << 'EOF'
import json, os
from pathlib import Path

log_text = Path("build_tail.log").read_text(errors="replace")

payload = {
    "run_id":  os.environ.get("GITHUB_RUN_ID", "0"),
    "repo":    os.environ.get("GITHUB_REPOSITORY", "unknown"),
    "commit":  os.environ.get("GITHUB_SHA", "unknown"),
    "branch":  os.environ.get("GITHUB_REF_NAME", "main"),
    "log_text": log_text
}

Path("payload.json").write_text(json.dumps(payload))
print(f"Payload written: {len(json.dumps(payload))} bytes")
EOF

          # Send payload from file — no size limit issues
          echo "Calling DevOps AI Agent..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$AGENT_URL" \
            -H "Content-Type: application/json" \
            -H "X-Agent-Signature: $AGENT_SECRET" \
            --data-binary @payload.json \
            --max-time 30)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Agent response: $HTTP_CODE — $BODY"
