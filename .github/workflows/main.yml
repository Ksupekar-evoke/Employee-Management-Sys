name: Build Spring Boot Application

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EmployeeManagementSystem

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Application
        id: build
        run: |
          mvn clean package -DskipTests 2>&1 | tee ../build.log
          echo "build_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload JAR Artifact
        if: steps.build.outputs.build_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: EmployeeManagementSystem/target/*.jar

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          retention-days: 7

      - name: Trigger AI Diagnosis
        if: steps.build.outputs.build_exit != '0'
        env:
          AGENT_URL:    ${{ secrets.AGENT_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          cd ..
          tail -200 build.log > build_tail.log
          python3 prepare_payload.py
          echo "Calling DevOps AI Agent..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$AGENT_URL" \
            -H "Content-Type: application/json" \
            -H "X-Agent-Signature: $AGENT_SECRET" \
            --data-binary @payload.json \
            --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Agent response: $HTTP_CODE - $BODY"

      - name: Fail if build failed
        if: steps.build.outputs.build_exit != '0'
        run: |
          echo "Build failed. AI Agent has been triggered."
          exit 1
